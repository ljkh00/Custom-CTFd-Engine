#user nobody nogroup; 
#pid /tmp/nginx.pid; 
error_log /var/log/nginx/error.log;
resolver 127.0.0.11 valid=30s;   # Docker embedded DNS (if in container)
    # or: resolver 1.1.1.1 8.8.8.8 valid=30s;  # Cloudflare/Google DNS
resolver_timeout 5s;
# Best set to 1 as long as CTFd is served up from the same host
#worker_processes 1; events {
