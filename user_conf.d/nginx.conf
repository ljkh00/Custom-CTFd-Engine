  server {
    listen 443 ssl deferred;
    # You must either change this line or set the hostname of the server (e.g. through docker-compose.yml) for correct serving and ssl to be accepted
    #server_name $hostname;
    # SSL settings: Ensure your certs have the correct host names
    #ssl_certificate /etc/ssl/ctfd.crt;
    #ssl_certificate_key /etc/ssl/ctfd.key;
    #ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    # Strong cryptography
    #ssl_protocols TLSv1.2;
    #ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES256-SHA:ECDHE-ECDSA-DES-CBC3-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA:!DSS:!3DES';
    #ssl_prefer_server_ciphers on;
    # ssl optimizations
    #ssl_session_timeout 5m;
    #ssl_session_cache shared:SSL:20m;
    #ssl_session_tickets on;
    #ssl_ciphers HIGH:!aNULL:!MD5;
    server_name skrctf.me;

    # Load the certificate files.
    ssl_certificate         /etc/letsencrypt/live/test-name/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/test-name/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/test-name/chain.pem;

    # Load the Diffie-Hellman parameter.
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;
    # Set connections to timout in 5 seconds
    keepalive_timeout 5;
    location / {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $http_host;
      proxy_redirect off;
      proxy_buffering off;
      proxy_pass http://ctfd:8000;
    }
    location /webshell {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $http_host;
      proxy_redirect off;
      proxy_buffering off;
      proxy_pass http://webshell/;
    }
    location /linux2 {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $http_host;
      proxy_redirect off;
      proxy_buffering off;
      proxy_pass http://linux2/;
    }
    #location /mfa2 {
    #  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #  proxy_set_header X-Forwarded-Proto https;
    #  proxy_set_header Host $http_host;
    #  proxy_redirect off;
    #  proxy_buffering off;
    #  proxy_pass http://mfa2/;
    #}
    #location ~ "/ports/(?<port>([a-f0-9]{32}))/(?<path>(.*))" {
    #  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #  proxy_set_header X-Forwarded-Proto https;
    #  proxy_set_header Host $http_host;
    #  proxy_hide_header Content-Type;
    #  proxy_pass_header Content-Type;
    #  proxy_redirect off;
    #  proxy_buffering off;
    #  proxy_pass http://web_$port/$path$is_args$args;
    #  add_header X-debug $path always;
    #}
    #location ~ "/ports/([a-f0-9]{32})/(.*)" {
    location ~ "/ports/(?<port>([a-f0-9]{32}))/(?<path>(.*))" {
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_set_header Host $host;

       proxy_redirect off;
       proxy_buffering off;

       set $backend "web_${port}";
       proxy_pass "http://$backend/$path$is_args$args";

       add_header X-Debug $path always;
    }
  }
